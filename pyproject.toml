[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-kan-turbulence"
version = "0.1.0"
description = "Bayesian tensor-basis Kolmogorov--Arnold networks with quantified uncertainty for RANS turbulence closures"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ali Eidi" },
    { name = "Kherlen Jigjid" },
    { name = "Tyler Buchanan" },
    { name = "Richard P. Dwight" },
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.2",
    "pykan>=0.2.8",
]

[tool.setuptools.packages.find]
include = ["bkan*"]
